name: Fetch Bilibili Data

on:
  schedule:
    # 每小时运行一次（UTC时间，北京时间 = UTC+8）
    - cron: '0 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Fetch data from Bilibili
      env:
        BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
      run: python fetch_data.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md data.json history.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update data: $(date +'%Y-%m-%d %H:%M:%S')"
        git push
