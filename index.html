<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #f5f5f7;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.06);
            --text: #1d1d1f;
            --text2: #6e6e73;
            --text3: #86868b;
            --blue: #0071e3;
            --purple: #5856d6;
            --pink: #ff2d55;
            --green: #34c759;
            --orange: #ff9500;
            --red: #ff3b30;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 18px;
            --radius-sm: 12px;
            --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 导航 */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            background: rgba(245, 245, 247, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .topbar-logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .topbar-tabs {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.04);
            padding: 4px;
            border-radius: 12px;
        }
        .topbar-tab {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: none;
        }
        .topbar-tab:hover { color: var(--text); }
        .topbar-tab.active {
            color: var(--text);
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .topbar-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text3);
            font-weight: 500;
        }
        .topbar-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.4);
        }

        /* 主内容 */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* UP主信息 */
        .profile {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px 32px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .profile:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .profile-avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .profile-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .profile-sign {
            font-size: 15px;
            color: var(--text2);
            margin-top: 6px;
            line-height: 1.5;
        }
        .profile-level {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            margin-top: 10px;
        }

        /* 数据卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            padding: 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .stat-card:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }
        .stat-card.c-blue::before { background: var(--blue); }
        .stat-card.c-purple::before { background: var(--purple); }
        .stat-card.c-pink::before { background: var(--pink); }
        .stat-card.c-green::before { background: var(--green); }
        .stat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .stat-num {
            font-size: 32px;
            font-weight: 700;
            font-family: var(--mono);
            letter-spacing: -1px;
        }
        .c-blue .stat-num { color: var(--blue); }
        .c-purple .stat-num { color: var(--purple); }
        .c-pink .stat-num { color: var(--pink); }
        .c-green .stat-num { color: var(--green); }
        .stat-delta {
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            font-family: var(--mono);
        }
        .stat-delta.up { color: var(--green); }
        .stat-delta.down { color: var(--red); }

        /* 图表区域 */
        .chart-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .chart-range {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.04);
            padding: 4px;
            border-radius: 10px;
        }
        .range-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
            cursor: pointer;
            border: none;
            background: none;
            transition: all 0.2s ease;
        }
        .range-btn:hover { color: var(--text); }
        .range-btn.active {
            color: var(--text);
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .chart-box {
            width: 100%;
            height: 360px;
        }

        /* 视频表格 */
        .video-table {
            width: 100%;
            border-collapse: collapse;
        }
        .video-table th {
            text-align: left;
            padding: 14px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .video-table td {
            padding: 16px 18px;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            vertical-align: middle;
        }
        .video-table tr {
            transition: background 0.2s ease;
        }
        .video-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .video-table .title-cell {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .video-table .num-cell {
            font-family: var(--mono);
            font-weight: 600;
            font-size: 13px;
        }
        .video-table .blue { color: var(--blue); }
        .video-table .pink { color: var(--pink); }
        .video-table .green { color: var(--green); }
        .video-table .orange { color: var(--orange); }
        .video-table .purple { color: var(--purple); }
        .video-cover-small {
            width: 88px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            vertical-align: middle;
            margin-right: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .video-title-link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .video-title-link:hover {
            color: var(--blue);
        }

        /* 历史对比表 */
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th {
            text-align: left;
            padding: 14px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .history-table td {
            padding: 14px 18px;
            font-size: 14px;
            font-family: var(--mono);
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .history-table tr {
            transition: background 0.2s ease;
        }
        .history-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        /* 加载 */
        .loading {
            text-align: center;
            padding: 80px;
            color: var(--text3);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.06);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 32px;
            font-size: 13px;
            color: var(--text3);
            font-weight: 500;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .profile { flex-direction: column; text-align: center; padding: 24px; }
            .topbar { padding: 0 16px; }
            .main { padding: 16px; }
            .video-table .title-cell { max-width: 160px; }
            .chart-section { padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="topbar">
        <div class="topbar-logo">Bilibili Dashboard</div>
        <div class="topbar-tabs">
            <button class="topbar-tab active" onclick="switchTab('overview')">概览</button>
            <button class="topbar-tab" onclick="switchTab('trend')">趋势</button>
            <button class="topbar-tab" onclick="switchTab('videos')">视频</button>
            <button class="topbar-tab" onclick="switchTab('history')">历史</button>
        </div>
        <div class="topbar-info">
            <span class="topbar-dot"></span>
            <span id="updateTime">--</span>
        </div>
    </nav>

    <div class="main">
        <!-- 概览 -->
        <div class="tab-content active" id="tab-overview">
            <div class="profile" id="profile" style="display:none">
                <img class="profile-avatar" id="avatar" src="" alt="" referrerpolicy="no-referrer">
                <div>
                    <div class="profile-name" id="name">--</div>
                    <div class="profile-sign" id="sign">--</div>
                    <span class="profile-level" id="level">LV0</span>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card c-blue">
                    <div class="stat-label">粉丝数</div>
                    <div class="stat-num" id="sFans">--</div>
                    <div class="stat-delta" id="sFansDelta"></div>
                </div>
                <div class="stat-card c-purple">
                    <div class="stat-label">总播放量</div>
                    <div class="stat-num" id="sViews">--</div>
                    <div class="stat-delta" id="sViewsDelta"></div>
                </div>
                <div class="stat-card c-pink">
                    <div class="stat-label">获赞数</div>
                    <div class="stat-num" id="sLikes">--</div>
                    <div class="stat-delta" id="sLikesDelta"></div>
                </div>
                <div class="stat-card c-green">
                    <div class="stat-label">视频数</div>
                    <div class="stat-num" id="sVideos">--</div>
                </div>
            </div>

            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">粉丝增长趋势</div>
                    <div class="chart-range">
                        <button class="range-btn active" onclick="setRange('7d', this)">7天</button>
                        <button class="range-btn" onclick="setRange('30d', this)">30天</button>
                        <button class="range-btn" onclick="setRange('all', this)">全部</button>
                    </div>
                </div>
                <div class="chart-box" id="overviewChart"></div>
            </div>
        </div>

        <!-- 趋势 -->
        <div class="tab-content" id="tab-trend">
            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">粉丝增长</div>
                    <div class="chart-range">
                        <button class="range-btn active" onclick="setTrendRange('7d', 'fans', this)">7天</button>
                        <button class="range-btn" onclick="setTrendRange('30d', 'fans', this)">30天</button>
                        <button class="range-btn" onclick="setTrendRange('all', 'fans', this)">全部</button>
                    </div>
                </div>
                <div class="chart-box" id="fansTrendChart"></div>
            </div>
            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">总播放量增长</div>
                    <div class="chart-range">
                        <button class="range-btn active" onclick="setTrendRange('7d', 'views', this)">7天</button>
                        <button class="range-btn" onclick="setTrendRange('30d', 'views', this)">30天</button>
                        <button class="range-btn" onclick="setTrendRange('all', 'views', this)">全部</button>
                    </div>
                </div>
                <div class="chart-box" id="viewsTrendChart"></div>
            </div>
            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">获赞数增长</div>
                    <div class="chart-range">
                        <button class="range-btn active" onclick="setTrendRange('7d', 'likes', this)">7天</button>
                        <button class="range-btn" onclick="setTrendRange('30d', 'likes', this)">30天</button>
                        <button class="range-btn" onclick="setTrendRange('all', 'likes', this)">全部</button>
                    </div>
                </div>
                <div class="chart-box" id="likesTrendChart"></div>
            </div>
        </div>

        <!-- 视频 -->
        <div class="tab-content" id="tab-videos">
            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">最新视频数据</div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="video-table" id="videoTable">
                        <thead>
                            <tr>
                                <th>视频</th>
                                <th>播放</th>
                                <th>弹幕</th>
                                <th>评论</th>
                                <th>点赞</th>
                                <th>收藏</th>
                                <th>投币</th>
                                <th>发布日期</th>
                            </tr>
                        </thead>
                        <tbody id="videoTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 历史 -->
        <div class="tab-content" id="tab-history">
            <div class="chart-section">
                <div class="chart-header">
                    <div class="chart-title">历史数据记录</div>
                    <div style="font-size: 13px; color: var(--text3); font-weight: 500;">
                        共 <span id="historyCount">0</span> 条记录
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="history-table" id="historyTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>粉丝</th>
                                <th>粉丝变化</th>
                                <th>总播放</th>
                                <th>播放变化</th>
                                <th>获赞</th>
                                <th>视频数</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        数据每小时自动更新 · Powered by GitHub Actions
    </footer>

    <script>
        // ============================================================
        // 全局状态
        // ============================================================
        let currentData = null;
        let historyData = [];
        let overviewChart = null;
        let fansTrendChart = null;
        let viewsTrendChart = null;
        let likesTrendChart = null;
        let currentRange = '7d';

        // ============================================================
        // 工具函数
        // ============================================================
        function fmt(num) {
            if (num === undefined || num === null) return '--';
            num = Number(num);
            if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
            if (num >= 10000) return (num / 10000).toFixed(1) + '万';
            return num.toLocaleString('zh-CN');
        }

        function fmtDate(ts) {
            const d = new Date(ts * 1000);
            return (d.getMonth() + 1) + '/' + d.getDate();
        }

        function fmtDateTime(ts) {
            const d = new Date(ts * 1000);
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function fmtDelta(val) {
            if (val > 0) return '+' + fmt(val);
            if (val < 0) return fmt(val);
            return '0';
        }

        // ============================================================
        // Tab切换
        // ============================================================
        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.topbar-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            event.target.classList.add('active');

            setTimeout(() => {
                overviewChart?.resize();
                fansTrendChart?.resize();
                viewsTrendChart?.resize();
                likesTrendChart?.resize();
            }, 100);
        }

        // ============================================================
        // 数据加载
        // ============================================================
        async function loadData() {
            try {
                const resp = await fetch('data.json?t=' + Date.now());
                currentData = await resp.json();

                const histResp = await fetch('history.json?t=' + Date.now());
                historyData = await histResp.json();

                renderAll();
            } catch (e) {
                console.error('加载失败:', e);
                document.querySelector('.main').innerHTML =
                    '<div class="loading">加载失败，请确认 data.json 和 history.json 文件存在</div>';
            }
        }

        function renderAll() {
            if (!currentData) return;

            const profile = document.getElementById('profile');
            profile.style.display = 'flex';
            document.getElementById('avatar').src = currentData.face;
            document.getElementById('name').textContent = currentData.name;
            document.getElementById('sign').textContent = currentData.sign || '';
            document.getElementById('level').textContent = 'LV' + currentData.level;
            document.getElementById('updateTime').textContent = '更新: ' + currentData.update_time;

            document.getElementById('sFans').textContent = fmt(currentData.fans);
            document.getElementById('sViews').textContent = fmt(currentData.total_views);
            document.getElementById('sLikes').textContent = fmt(currentData.total_likes);
            document.getElementById('sVideos').textContent = currentData.video_count;

            if (historyData.length >= 2) {
                const prev = historyData[historyData.length - 2];
                const fansDelta = currentData.fans - prev.fans;
                const viewsDelta = currentData.total_views - prev.total_views;
                const likesDelta = currentData.total_likes - prev.total_likes;

                setDelta('sFansDelta', fansDelta, '人');
                setDelta('sViewsDelta', viewsDelta, '次');
                setDelta('sLikesDelta', likesDelta, '次');
            }

            renderOverviewChart();
            renderTrendCharts();
            renderVideoTable();
            renderHistoryTable();
        }

        function setDelta(id, val, unit) {
            const el = document.getElementById(id);
            if (val > 0) {
                el.textContent = '↑ ' + fmt(val) + ' ' + unit;
                el.className = 'stat-delta up';
            } else if (val < 0) {
                el.textContent = '↓ ' + fmt(Math.abs(val)) + ' ' + unit;
                el.className = 'stat-delta down';
            } else {
                el.textContent = '— 无变化';
                el.className = 'stat-delta';
            }
        }

        // ============================================================
        // 图表渲染
        // ============================================================
        function filterByRange(data, range) {
            if (range === 'all') return data;
            const now = Date.now() / 1000;
            const days = range === '7d' ? 7 : 30;
            const cutoff = now - days * 86400;
            return data.filter(d => d.timestamp >= cutoff);
        }

        function makeChartOption(data, key, color, label) {
            return {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: 'rgba(0, 0, 0, 0.08)',
                    borderWidth: 1,
                    textStyle: { color: '#1d1d1f', fontSize: 13, fontWeight: 500 },
                    formatter: function(params) {
                        const p = params[0];
                        return '<div style="font-weight:600;margin-bottom:4px">' + p.axisValue + '</div>' + 
                               label + ': <span style="color:' + color + ';font-weight:700">' + fmt(p.value) + '</span>';
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '10%', top: '8%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: data.map(d => fmtDateTime(d.timestamp)),
                    axisLabel: { color: '#86868b', fontSize: 11, fontWeight: 500, rotate: 30 },
                    axisLine: { lineStyle: { color: 'rgba(0, 0, 0, 0.06)' } },
                    axisTick: { show: false },
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: '#86868b', fontSize: 11, fontWeight: 500, formatter: v => fmt(v) },
                    splitLine: { lineStyle: { color: 'rgba(0, 0, 0, 0.04)' } },
                    axisLine: { show: false },
                    axisTick: { show: false },
                },
                series: [{
                    type: 'line',
                    data: data.map(d => d[key]),
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    lineStyle: { color: color, width: 3 },
                    itemStyle: { color: color, borderWidth: 2, borderColor: '#fff' },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: color + '30' },
                                { offset: 1, color: color + '05' },
                            ]
                        }
                    },
                }],
            };
        }

        function renderOverviewChart() {
            if (!overviewChart) {
                overviewChart = echarts.init(document.getElementById('overviewChart'));
            }
            const filtered = filterByRange(historyData, currentRange);
            if (filtered.length < 2) {
                overviewChart.setOption({
                    backgroundColor: 'transparent',
                    title: { text: '数据不足，至少需要2条记录', left: 'center', top: 'center', textStyle: { color: '#86868b', fontSize: 14, fontWeight: 500 } },
                });
                return;
            }
            overviewChart.setOption(makeChartOption(filtered, 'fans', '#0071e3', '粉丝'));
        }

        function setRange(range, btn) {
            currentRange = range;
            btn.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOverviewChart();
        }

        function renderTrendCharts() {
            if (!fansTrendChart) fansTrendChart = echarts.init(document.getElementById('fansTrendChart'));
            if (!viewsTrendChart) viewsTrendChart = echarts.init(document.getElementById('viewsTrendChart'));
            if (!likesTrendChart) likesTrendChart = echarts.init(document.getElementById('likesTrendChart'));

            const filtered = filterByRange(historyData, '7d');
            if (filtered.length >= 2) {
                fansTrendChart.setOption(makeChartOption(filtered, 'fans', '#0071e3', '粉丝'));
                viewsTrendChart.setOption(makeChartOption(filtered, 'total_views', '#5856d6', '总播放'));
                likesTrendChart.setOption(makeChartOption(filtered, 'total_likes', '#ff2d55', '获赞'));
            }
        }

        function setTrendRange(range, key, btn) {
            btn.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            b.classList.add('active');
            const filtered = filterByRange(historyData, range);
            const chartMap = { fans: fansTrendChart, views: viewsTrendChart, likes: likesTrendChart };
            const colorMap = { fans: '#0071e3', views: '#5856d6', likes: '#ff2d55' };
            const labelMap = { fans: '粉丝', views: '总播放', likes: '获赞' };
            if (filtered.length >= 2) {
                chartMap[key].setOption(makeChartOption(filtered, key === 'views' ? 'total_views' : key === 'likes' ? 'total_likes' : 'fans', colorMap[key], labelMap[key]));
            }
        }

        // ============================================================
        // 视频表格
        // ============================================================
        function renderVideoTable() {
            const tbody = document.getElementById('videoTableBody');
            const videos = currentData.videos || [];
            if (videos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:48px">暂无视频</td></tr>';
                return;
            }

            tbody.innerHTML = videos.map(v => {
                const pic = (v.pic || '').replace('http://', 'https://');
                const date = new Date(v.created * 1000);
                const dateStr = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');

                return `<tr>
                    <td class="title-cell">
                        <img class="video-cover-small" src="${pic}" alt="" loading="lazy" referrerpolicy="no-referrer">
                        <a class="video-title-link" href="https://www.bilibili.com/video/${v.bvid}" target="_blank">${v.title}</a>
                    </td>
                    <td class="num-cell blue">${fmt(v.play)}</td>
                    <td class="num-cell pink">${fmt(v.video_review)}</td>
                    <td class="num-cell green">${fmt(v.comment)}</td>
                    <td class="num-cell orange">${fmt(v.like)}</td>
                    <td class="num-cell purple">${fmt(v.favorites)}</td>
                    <td class="num-cell" style="color:var(--orange)">${fmt(v.coin)}</td>
                    <td style="color:var(--text3);font-size:13px;font-weight:500">${dateStr}</td>
                </tr>`;
            }).join('');
        }

        // ============================================================
        // 历史表格
        // ============================================================
        function renderHistoryTable() {
            document.getElementById('historyCount').textContent = historyData.length;

            const tbody = document.getElementById('historyTableBody');
            if (historyData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:48px">暂无历史记录</td></tr>';
                return;
            }

            const reversed = [...historyData].reverse();

            tbody.innerHTML = reversed.map((record, idx) => {
                const prev = idx < reversed.length - 1 ? reversed[idx + 1] : null;
                const fansDelta = prev ? record.fans - prev.fans : 0;
                const viewsDelta = prev ? record.total_views - prev.total_views : 0;

                const fansDeltaStr = fansDelta > 0 ? `<span style="color:var(--green)">+${fmt(fansDelta)}</span>` :
                                     fansDelta < 0 ? `<span style="color:var(--red)">${fmt(fansDelta)}</span>` :
                                     '<span style="color:var(--text3)">0</span>';
                const viewsDeltaStr = viewsDelta > 0 ? `<span style="color:var(--green)">+${fmt(viewsDelta)}</span>` :
                                      viewsDelta < 0 ? `<span style="color:var(--red)">${fmt(viewsDelta)}</span>` :
                                      '<span style="color:var(--text3)">0</span>';

                return `<tr>
                    <td style="color:var(--text2)">${record.update_time}</td>
                    <td style="color:var(--blue)">${fmt(record.fans)}</td>
                    <td>${fansDeltaStr}</td>
                    <td style="color:var(--purple)">${fmt(record.total_views)}</td>
                    <td>${viewsDeltaStr}</td>
                    <td style="color:var(--pink)">${fmt(record.total_likes)}</td>
                    <td>${record.video_count}</td>
                </tr>`;
            }).join('');
        }

        // ============================================================
        // 启动
        // ============================================================
        loadData();
        window.addEventListener('resize', () => {
            overviewChart?.resize();
            fansTrendChart?.resize();
            viewsTrendChart?.resize();
            likesTrendChart?.resize();
        });
    </script>
</body>
</html>
